<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seu Nome | Portfólio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <!-- links para #inicio, #sobre, #habilidades, #projetos, #contato -->
    </nav>
  </header>

  <main>
    <section id="inicio">
      <!-- seu nome, sua área, uma frase e o botão "Baixar currículo" -->
    </section>

    <section id="sobre">
      <!-- título + 2 ou 3 frases (foto com alt, se quiser) -->
    </section>

    <section id="habilidades">
      <!-- título + lista (ul) com 3 a 6 itens -->
    </section>

    <section id="projetos">
      <!-- título + 2 a 4 projetos, cada um com título e descrição -->
    </section>

    <section id="contato">
      <!-- título + formulário -->
      <form>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem"></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <!-- © 2026 + seu nome -->
  </footer>

  <script src="script.js"></script>
</body>
</html>
